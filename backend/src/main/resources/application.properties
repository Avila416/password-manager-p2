# ===============================
# SERVER
# ===============================
server.port=8083

# ===============================
# SQL DATABASE CONFIG (MySQL)
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vaultdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Avila@123

# ===============================
# JPA CONFIG
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework=INFO
logging.level.com.passwordmanager=DEBUG

# ===============================
# ENCRYPTION SECRET (IMPORTANT)
# ===============================
vault.encryption.secret=MySuperSecretKey123

