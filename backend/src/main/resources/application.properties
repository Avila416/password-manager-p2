# ===============================
# SERVER
# ===============================
server.port=8084

# ===============================
# MYSQL DATABASE
# ===============================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:vault_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
# Default password is empty; set DB_PASSWORD env var if your MySQL user has a password.
spring.datasource.password=Akhila@28

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=always

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:replace-with-a-long-random-secret-key}
jwt.expiration=86400000

# ===============================
# VAULT
# ===============================
vault.encryption.secret=${VAULT_ENCRYPTION_SECRET:MySuperSecretKey123}
vault.master-password=${VAULT_MASTER_PASSWORD:admin123}

# ===============================
# FILE UPLOAD CONFIG
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# BACKUP STORAGE LOCATION
# ===============================
backup.storage.path=backup/

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework=INFO
logging.level.com.passwordmanager=DEBUG
