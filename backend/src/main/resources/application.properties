# ===============================
# SERVER
# ===============================
server.port=8082

# ===============================
# H2 DATABASE CONFIG
# ===============================
spring.datasource.url=jdbc:h2:mem:vaultdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# JPA CONFIG
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework=INFO
logging.level.com.passwordmanager=DEBUG

# ===============================
# ENCRYPTION SECRET (IMPORTANT)
# ===============================
vault.encryption.secret=MySuperSecretKey123

# ===============================
# MASTER PASSWORD (DEMO)
# ===============================
vault.master-password=admin123
