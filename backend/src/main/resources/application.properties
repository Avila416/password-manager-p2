# ===============================
# SERVER
# ===============================
server.port=8082

# ===============================
# MYSQL DATABASE (Docker)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/vault_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework=INFO
logging.level.com.passwordmanager=DEBUG

# ===============================
# ENCRYPTION SECRET (IMPORTANT)
# ===============================
vault.encryption.secret=MySuperSecretKey123

# ===============================
# MASTER PASSWORD (DEMO)
# ===============================
# vault.master-password=admin123
