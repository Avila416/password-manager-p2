# ===============================
# SERVER
# ===============================
server.port=8084

# ===============================
# MYSQL DATABASE
# ===============================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:vault_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=%2B05:30&connectionTimeZone=%2B05:30&forceConnectionTimeZoneToSession=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=0508

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=+05:30

# ===============================
# JWT
# ===============================
jwt.secret=replace-with-a-long-random-secret-key
jwt.expiration=86400000

# ===============================
# VAULT
# ===============================
vault.encryption.secret=MySuperSecretKey123
vault.master-password=admin123

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework=INFO
logging.level.com.passwordmanager=DEBUG

# ===============================
# SPRING SECURITY DEFAULT USER
# ===============================
spring.security.user.name=admin
spring.security.user.password=admin
