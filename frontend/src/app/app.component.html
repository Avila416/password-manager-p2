<div class="app-shell">
  <aside class="sidebar">
    <h1>Password Manager</h1>
    <nav>
      <a routerLink="/vault" routerLinkActive="active">Vault</a>
      <a href="http://localhost:4200/login" target="_blank" rel="noreferrer">Auth Login</a>
    </nav>
  </aside>

  <section class="content-area">
    <router-outlet></router-outlet>
  </section>
<div class="layout">
  <header class="topbar">
    <h1>Password Manager</h1>
    <nav>
      <a routerLink="/login">Login</a>
      <a routerLink="/register">Register</a>
      <a routerLink="/forgot-password">Forgot Password</a>
      <a *ngIf="authService.isAuthenticated()" routerLink="/master-password">Master Password</a>
      <button *ngIf="authService.isAuthenticated()" (click)="logout()">Logout</button>
    </nav>
  </header>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
