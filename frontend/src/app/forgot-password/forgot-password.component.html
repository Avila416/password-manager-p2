<section class="card">
  <h2>Forgot Password</h2>

  <label>
    Email
    <input [(ngModel)]="form.email" name="email" />
  </label>
  <button (click)="requestCode()">Request Verification Code</button>

  <label>
    Verification Code
    <input [(ngModel)]="form.verificationCode" name="verificationCode" />
  </label>
  <label>
    New Password
    <input type="password" [(ngModel)]="form.newPassword" name="newPassword" />
  </label>
  <label>
    Confirm Password
    <input type="password" [(ngModel)]="form.confirmPassword" name="confirmPassword" />
  </label>

  <button (click)="resetPassword()">Reset Password</button>
  <p class="ok" *ngIf="message">{{ message }}</p>
  <p class="err" *ngIf="error">{{ error }}</p>
</section>
