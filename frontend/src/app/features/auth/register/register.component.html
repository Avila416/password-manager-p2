<div class="register-container">
  <div class="register-card">
    <h2>Register</h2>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <!-- Username -->
      <input
        type="text"
        placeholder="Username"
        formControlName="username"
      />
      <div class="error" *ngIf="username?.invalid && username?.touched">
        Username must be at least 3 characters
      </div>

      <!-- Email -->
      <input
        type="email"
        placeholder="Email"
        formControlName="email"
      />
      <div class="error" *ngIf="email?.invalid && email?.touched">
        Enter a valid email
      </div>

      <!-- Password -->
      <input
        type="password"
        placeholder="Password"
        formControlName="password"
      />

      <!-- Password Strength -->
      <app-password-strength-meter
        [password]="password?.value">
      </app-password-strength-meter>

      <div class="error" *ngIf="password?.invalid && password?.touched">
        Password must be at least 8 characters
      </div>

      <!-- Confirm Password -->
      <input
        type="password"
        placeholder="Confirm Password"
        formControlName="confirmPassword"
      />
      <div class="error" *ngIf="registerForm.errors?.['passwordMismatch'] && confirmPassword?.touched">
        Passwords do not match
      </div>

      <!-- Submit Button -->
      <button type="submit" [disabled]="registerForm.invalid">
        Register
      </button>

    </form>
  </div>
</div>
