<main class="page">
  <header class="hero">
    <h1>Password Generator</h1>
    <p>Create strong passwords quickly.</p>
  </header>

  <section class="card form-card">
    <label>
      Password Length
      <input type="number" min="8" max="64" [(ngModel)]="length" />
    </label>
    <label>
      Number of Passwords
      <input type="number" min="1" max="20" [(ngModel)]="count" />
    </label>

    <div class="checks">
      <label><input type="checkbox" [(ngModel)]="includeUppercase" /> Uppercase</label>
      <label><input type="checkbox" [(ngModel)]="includeLowercase" /> Lowercase</label>
      <label><input type="checkbox" [(ngModel)]="includeNumbers" /> Numbers</label>
      <label><input type="checkbox" [(ngModel)]="includeSpecial" /> Special chars</label>
    </div>

    <button class="btn" (click)="generate()">Generate Passwords</button>
    <p class="fail" *ngIf="error">{{ error }}</p>
  </section>

  <section class="card" *ngIf="generated.length">
    <h2>Generated</h2>
    <ul>
      <li *ngFor="let pwd of generated"><code>{{ pwd }}</code></li>
    </ul>
  </section>
</main>
